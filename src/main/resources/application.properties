spring.application.name=beer-catalogue-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

api.prefix=/api/v1

# Graceful shutdown: stop accepting new requests, finish in-flight ones
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator: expose only what Kubernetes needs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never