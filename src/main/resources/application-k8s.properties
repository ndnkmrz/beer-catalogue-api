# Active in EKS via SPRING_PROFILES_ACTIVE=k8s
# Inherits application.properties; overrides what differs in the cluster.

# Do not dump SQL into prod logs
spring.jpa.show-sql=false

# Docker Compose support must never start in the cluster (it is a local-dev tool)
spring.docker.compose.enabled=false

# DB connection comes from env vars injected by the Deployment (DB_URL etc.)