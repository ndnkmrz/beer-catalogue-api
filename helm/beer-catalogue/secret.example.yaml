# secret.example.yaml
#
# This is a TEMPLATE only. The real Secret is NEVER committed.
# Create it directly against the cluster, e.g.:
#
#   kubectl create secret generic beer-db-credentials \
#     --from-literal=db-password='YOUR_RDS_PASSWORD'
#
# Or pass it at install time so Helm references it without storing it:
#
#   helm install beer ./helm/beer-catalogue \
#     --set database.existingSecret=beer-db-credentials
#
# NOTE: base64 in a Secret is encoding, not encryption. That is why we keep
# the value out of the repo entirely. See README for the AWS Secrets Manager
# alternative (External Secrets Operator / IRSA) used in real production.

apiVersion: v1
kind: Secret
metadata:
  name: beer-db-credentials
type: Opaque
stringData:
  db-password: "CHANGE_ME"